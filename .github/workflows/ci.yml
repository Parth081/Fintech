name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, test, build, e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run test:e2e

  verify-m2:
    name: M2 money-core verification (verify:m2, quick)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Launches the whole system on temp ports (PGlite ledger, 0 delays), sends 500 payments with
      # the default scenario mix, then checks balances, journals, duplicates, state machine, stuck payments.
      - run: npm run verify:m2 -- --count 500 --report-dir verify-report
      - run: npm run verify:m2 -- --count 300 --chaos --chaos-interval 2000 --seed 7 --report-dir verify-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-m2-report
          path: verify-report/

  verify-m3:
    name: M3 Gate 2 - provider-outage scenario (verify:m3, 2 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Launches the whole system on temp ports (PGlite ledger, ambient traffic on, offline), runs the
      # provider-outage scenario twice; after each run checks control events, breaker open / respected /
      # recovered, terminal payments, duplicates, state machine, ledger, gateway, and a reset under 10 s.
      - run: npm run verify:m3 -- --runs 2 --report-dir verify-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-m3-report
          path: verify-report/

  verify-m4:
    name: M4 - operations console + risk & compliance (verify:m4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Launches the whole system (incl. ops) on temp ports with a PGlite ledger and ops store, runs the
      # sanctions-hit / fraud-ring / fx-spike scenarios and drives cases (four-eyes), retry, refund and a
      # maker-checker config change through the gateway as different demo users; checks (a)-(j).
      - run: npm run verify:m4 -- --report-dir verify-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-m4-report
          path: verify-report/

  compose:
    name: Validate docker compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: docker compose -f deploy/docker-compose.yml --profile redpanda config --quiet
        env:
          BUS: kafka
