# Global Fintech Control Tower - container setup (simulation, synthetic data only).
#
# Default (built-in local broker, same as `npm start`):
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://127.0.0.1:7072
#
# Redpanda / Kafka profile:
#   BUS=kafka docker compose -f deploy/docker-compose.yml --profile redpanda up --build
# NOTE: the Kafka/Redpanda path (BUS=kafka) was verified manually on 2026-10-22 (end-to-end payments,
# 10 concurrent, restart without duplicates). The local broker remains the default for M1. In kafka
# mode the `broker` container still starts but nothing uses it.
#
# Every service is the same image; the command picks the entrypoint. All env names/defaults come from
# packages/contracts/src/config.ts.

name: fintech-control-tower

x-service: &service
  image: fintech-control-tower:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment:
    HOST: 0.0.0.0
    BROKER_PORT: "7070"
    PAYMENT_API_PORT: "7071"
    GATEWAY_PORT: "7072"
    BUS: ${BUS:-local}
    BROKER_URL: ws://broker:7070
    KAFKA_BROKERS: redpanda:9092
    PAYMENT_API_URL: http://payment-api:7071
    GATEWAY_URL: http://gateway:7072
    DATA_DIR: /data
    STAGE_DELAY_MS: ${STAGE_DELAY_MS:-400}
    SETTLEMENT_DELAY_MS: ${SETTLEMENT_DELAY_MS:-900}

# Stages and the payment API start once the broker answers /health. `required: false` lets the
# redpanda dependency be ignored when the redpanda profile is not active.
x-after-bus: &after-bus
  broker:
    condition: service_healthy
  redpanda:
    condition: service_healthy
    required: false

x-stage: &stage
  <<: *service
  depends_on: *after-bus

services:
  broker:
    <<: *service
    command: ["services/broker/src/index.ts"]
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  payment-api:
    <<: *service
    command: ["services/payment-api/src/index.ts"]
    depends_on: *after-bus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7071/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  screening:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "screening"]
  risk:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "risk"]
  fx:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "fx"]
  routing:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "routing"]
  settlement:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "settlement"]
  ledger:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "ledger"]
  reconciliation:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "reconciliation"]

  gateway:
    <<: *service
    command: ["services/gateway/src/index.ts"]
    depends_on:
      payment-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:7072:7072"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7072/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- profile: redpanda (single-node Kafka API) - verified manually 2026-10-22 -------------------
  redpanda:
    profiles: ["redpanda"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  broker-data:
  redpanda-data:
