# Global Fintech Control Tower - container setup (simulation, synthetic data only).
#
# Default (built-in local broker, same as `npm start`; ledger on Postgres 17):
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#   open http://127.0.0.1:7072
#   npm run verify:m2 -- --url http://127.0.0.1:7072 --count 500     # optional: prove it
#   docker compose -f deploy/docker-compose.yml down -v               # stop + delete volumes
#
# Ports published on 127.0.0.1 only: broker 7070, payment-api 7071, gateway 7072, ledger 7073,
# orchestrator 7074 (scenarios, ambient traffic, presenter API), assistant 7076, booth 7077.
# Unlike `npm start` (embedded PGlite under DATA_DIR/ledger), the ledger here uses the `postgres`
# service through DATABASE_URL (ADR 0005).
#
# M3: the presenter console works here too (http://127.0.0.1:7072/#/presenter: scenarios, pace,
# ambient traffic), but RESET IS NOT AVAILABLE in Docker: there is no launcher process to stop and
# restart the services, so LAUNCHER_CONTROL_URL is empty and POST /api/control/reset answers 503.
# To start from a clean slate in Docker, recreate the stack:
#   docker compose -f deploy/docker-compose.yml down -v && docker compose -f deploy/docker-compose.yml up -d --wait
# Ambient payments per second while no scenario runs: AMBIENT_RATE (default 3; 0 = off).
#
# M5: AI explainer (assistant, 7076) and booth (7077: kiosk leads + anonymous analytics).
# In Docker the explainer is OFFLINE by default (ASSISTANT_LLM=off: grounded answers built from the event
# log, no network). To let Claude phrase the answers (every number is still verified against the log):
#   ASSISTANT_LLM=auto ANTHROPIC_API_KEY=... docker compose -f deploy/docker-compose.yml up -d
# The key is passed to the assistant container only. Booth leads live in the booth-data volume; set
# BOOTH_STAFF_PIN for a real event (default demo PIN 2468). `down -v` deletes the leads too.
#
# Redpanda / Kafka profile:
#   BUS=kafka docker compose -f deploy/docker-compose.yml --profile redpanda up --build
# NOTE: the Kafka/Redpanda path (BUS=kafka) was verified manually on 2026-10-22 (end-to-end payments,
# 10 concurrent, restart without duplicates). The local broker remains the default for M1. In kafka
# mode the `broker` container still starts but nothing uses it.
#
# Every service is the same image; the command picks the entrypoint. All env names/defaults come from
# packages/contracts/src/config.ts.

name: fintech-control-tower

x-service: &service
  image: fintech-control-tower:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment:
    HOST: 0.0.0.0
    BROKER_PORT: "7070"
    PAYMENT_API_PORT: "7071"
    GATEWAY_PORT: "7072"
    LEDGER_PORT: "7073"
    ORCHESTRATOR_PORT: "7074"
    ASSISTANT_PORT: "7076"
    BOOTH_PORT: "7077"
    BUS: ${BUS:-local}
    BROKER_URL: ws://broker:7070
    KAFKA_BROKERS: redpanda:9092
    PAYMENT_API_URL: http://payment-api:7071
    GATEWAY_URL: http://gateway:7072
    LEDGER_URL: http://ledger:7073
    ORCHESTRATOR_URL: http://orchestrator:7074
    ASSISTANT_URL: http://assistant:7076
    BOOTH_URL: http://booth:7077
    # No launcher in Docker: reset is unavailable (the gateway answers 503).
    LAUNCHER_CONTROL_URL: ""
    AMBIENT_RATE: ${AMBIENT_RATE:-3}
    DATA_DIR: /data
    STAGE_DELAY_MS: ${STAGE_DELAY_MS:-400}
    SETTLEMENT_DELAY_MS: ${SETTLEMENT_DELAY_MS:-900}
    SIM_SEED: ${SIM_SEED:-control-tower}
    PROVIDER_FAILURE_SCALE: ${PROVIDER_FAILURE_SCALE:-1}

# Stages and the payment API start once the broker answers /health. `required: false` lets the
# redpanda dependency be ignored when the redpanda profile is not active.
x-after-bus: &after-bus
  broker:
    condition: service_healthy
  redpanda:
    condition: service_healthy
    required: false

x-stage: &stage
  <<: *service
  depends_on: *after-bus

services:
  broker:
    <<: *service
    command: ["services/broker/src/index.ts"]
    volumes:
      - broker-data:/data
    ports:
      - "127.0.0.1:7070:7070"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  payment-api:
    <<: *service
    command: ["services/payment-api/src/index.ts"]
    depends_on: *after-bus
    ports:
      - "127.0.0.1:7071:7071"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7071/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  screening:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "screening"]
  risk:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "risk"]
  fx:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "fx"]
  routing:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "routing"]
  settlement:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "settlement"]
  reconciliation:
    <<: *stage
    command: ["services/stages/src/index.ts", "--stage", "reconciliation"]

  # Double-entry ledger service (M2): replaces the M1 ledger stage. Postgres via DATABASE_URL.
  ledger:
    <<: *service
    command: ["services/ledger/src/index.ts"]
    environment:
      HOST: 0.0.0.0
      BROKER_PORT: "7070"
      PAYMENT_API_PORT: "7071"
      GATEWAY_PORT: "7072"
      LEDGER_PORT: "7073"
      BUS: ${BUS:-local}
      BROKER_URL: ws://broker:7070
      KAFKA_BROKERS: redpanda:9092
      LEDGER_URL: http://ledger:7073
      DATA_DIR: /data
      DATABASE_URL: postgres://ct:ct-local-only@postgres:5432/ledger
      STAGE_DELAY_MS: ${STAGE_DELAY_MS:-400}
      SETTLEMENT_DELAY_MS: ${SETTLEMENT_DELAY_MS:-900}
      SIM_SEED: ${SIM_SEED:-control-tower}
      PROVIDER_FAILURE_SCALE: ${PROVIDER_FAILURE_SCALE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      redpanda:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:7073:7073"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7073/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Ledger database. Synthetic data only; the password is a local-only placeholder.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct-local-only
      POSTGRES_DB: ledger
    volumes:
      - ledger-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # M3: scenarios (provider outage), ambient traffic and presentation pacing. Publishes control
  # events on the payment log and posts ambient payments to the payment API.
  orchestrator:
    <<: *service
    command: ["services/orchestrator/src/index.ts"]
    depends_on:
      broker:
        condition: service_healthy
      redpanda:
        condition: service_healthy
        required: false
      payment-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:7074:7074"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7074/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # M5: AI explainer. Reads the event log; narrates recorded facts only. Offline unless ASSISTANT_LLM=auto
  # and credentials are provided.
  assistant:
    <<: *service
    command: ["services/assistant/src/index.ts"]
    environment:
      HOST: 0.0.0.0
      ASSISTANT_PORT: "7076"
      BUS: ${BUS:-local}
      BROKER_URL: ws://broker:7070
      KAFKA_BROKERS: redpanda:9092
      ORCHESTRATOR_URL: http://orchestrator:7074
      LEDGER_URL: http://ledger:7073
      DATA_DIR: /data
      ASSISTANT_LLM: ${ASSISTANT_LLM:-off}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: *after-bus
    ports:
      - "127.0.0.1:7076:7076"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7076/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # M5: booth back end (visitor leads with explicit consent, anonymous analytics). No bus, no outbound
  # requests; data in the booth-data volume (/data/booth).
  booth:
    <<: *service
    command: ["services/booth/src/index.ts"]
    environment:
      HOST: 0.0.0.0
      BOOTH_PORT: "7077"
      DATA_DIR: /data
      BOOTH_STAFF_PIN: ${BOOTH_STAFF_PIN:-2468}
    volumes:
      - booth-data:/data
    ports:
      - "127.0.0.1:7077:7077"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7077/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  gateway:
    <<: *service
    command: ["services/gateway/src/index.ts"]
    depends_on:
      payment-api:
        condition: service_healthy
      ledger:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    ports:
      - "127.0.0.1:7072:7072"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7072/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- profile: redpanda (single-node Kafka API) - verified manually 2026-10-22 -------------------
  redpanda:
    profiles: ["redpanda"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  booth-data:
  broker-data:
  redpanda-data:
  ledger-pg:
